[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speechflaw"
version = "1.0.0"
description = "Contrastive Speech Analytics & Temporal Flaw Grounding for Competitive Oratory"
authors = [
    { name = "Priyanshu Singh", email = "priyanshusingh75494@gmail.com" },
    { name = "Aarav Sharma" },
    { name = "Rohan Verma" },
    { name = "Ananya Iyer" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "soundfile>=0.12.0",
    "librosa>=1.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8.0",
    "edge-tts>=7.0.0",
    "imageio-ffmpeg>=0.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["src"]
