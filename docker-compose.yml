version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speechflaw-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: speechflaw-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
